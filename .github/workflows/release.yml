# Builds the Windows installer (Oley-Setup-x.y.z.exe) and a portable zip.
# - Publish a release on GitHub (tag like v2.1.0): both files are attached to it.
# - Push a tag like v2.1.0: a release is made with them.
# - Run it by hand from the Actions tab: they're kept as a download on the run.
name: Build Windows installer

on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name || github.ref_name }}'
          if ($tag -match '^v?(\d+\.\d+\.\d+)') { $v = $Matches[1] }
          else { $v = (Select-String -Path oley/__init__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building Oley $v"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install PyAudioWPatch onnxruntime Pillow pyinstaller

      - name: Check the app imports
        run: python -c "import oley.app, oley.engine, oley.shell, oley.media; print('ok')"

      - name: Build Oley.exe
        run: pyinstaller packaging/oley.spec --noconfirm --distpath dist --workpath build

      - name: Smoke test (starts headless and stops)
        shell: pwsh
        run: |
          $env:OLEY_DATA = "$env:RUNNER_TEMP\oley-test"
          $env:OLEY_NO_SUPERVISOR = "1"
          $p = Start-Process -FilePath dist\Oley\Oley.exe -ArgumentList '--headless','--mock' -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Get-Content "$env:OLEY_DATA\oley.log" -ErrorAction SilentlyContinue; throw "Oley.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Get-Content "$env:OLEY_DATA\oley.log" -Tail 20 -ErrorAction SilentlyContinue

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\oley.iss
          Compress-Archive -Path dist\Oley\* -DestinationPath "dist\Oley-${{ steps.ver.outputs.version }}-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Oley-${{ steps.ver.outputs.version }}
          path: |
            dist/Oley-Setup-*.exe
            dist/Oley-*-portable.zip

      - name: Attach to the release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          body_path: ${{ github.event_name == 'push' && 'packaging/release-notes.md' || '' }}
          files: |
            dist/Oley-Setup-*.exe
            dist/Oley-*-portable.zip
